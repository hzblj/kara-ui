# Metro and the Expo/RN native build tooling resolve modules from disk,
# so PnP is not an option here — keep a real node_modules tree.
nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org"

enableGlobalCache: true

# Our own scope skips Yarn's 24-hour quarantine of new versions, so kara can take a fresh
# @hzblj/expo-rich-haptics release at once. Every other package still waits.
npmPreapprovedPackages:
  - "@hzblj/*"
