import groovy.json.JsonSlurper

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def packageJson = new JsonSlurper().parseText(file('../package.json').text)

group = 'expo.modules.kara.ui'
version = packageJson.version

android {
  namespace "expo.modules.kara.ui"
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // The views register into @expo/ui's modifier registry and render its slots, so they compile against the copy
  // the app already links rather than bundling a second one.
  compileOnly 'expo.modules.ui:expo.modules.ui:57.+'

  implementation 'androidx.compose.foundation:foundation-android:1.10.2'
  implementation 'androidx.compose.ui:ui-android:1.10.2'
  // The FAB menu and the toggle FAB are Material 3 Expressive, which is still alpha.
  implementation "androidx.compose.material3:material3:1.5.0-alpha13"
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha13'
  implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
  implementation "androidx.graphics:graphics-shapes:1.1.0"
  implementation "androidx.core:core-ktx:1.17.0"
}
